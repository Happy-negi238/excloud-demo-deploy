name: Deploy Nodejs on Excloud

on:
  push:
    branches:
      - main

jobs:
  deploy: 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Build and Push
        run: |
          docker build -t happysingh2005/chaicode-node .
          docker push happysingh2005/chaicode-node

      - name: Deploy on Excloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 210.79.129.226
          username: ubuntu
          key: ${{ secrets.PRIVATE_SSH_KEY }}
          script: |
            # cd /home/ubuntu/excloud-demo-deploy
            cd /home/ubuntu/excloud-demo-deploy

            # git pull
            git pull origin main

            # make sure to pull a fresh copy of happysingh2005/chaicode-node
            sudo docker compose pull

            # docker compose up -d
            sudo docker compose up -d

            # clean up old/unused images
            sudo docker image prune -f