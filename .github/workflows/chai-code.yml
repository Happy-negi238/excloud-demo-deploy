name: Deploy Nodejs on Excloud

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Build and Push
        run: |
          docker build -t happysingh2005/chaicode-node .
          docker push happysingh2005/chaicode-node

      - name: Deploy on Excloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 210.79.129.226
          username: ubuntu
          key: ${{ secrets.PRIVATE_SSH_KEY }}
          script: |
            # kill the existing docker continer
            sudo docker rm -f chaicode-node || true

            # again pull the fresh docker image
            sudo docker pull happysingh2005/chaicode-node

            # run docker container -d -p 80:8000 happysingh2005/chaicode-node
            sudo docker run -d --name chaicode-node --restart unless-stopped -p 80:8000 happysingh2005/chaicode-node

            # clean up old/unused image
            sudo docker image prune -f
